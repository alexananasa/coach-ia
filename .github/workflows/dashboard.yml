name: Mettre à jour et publier le tableau de bord

on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * *"
  push:
    branches:
      - main
    paths:
      - "generate_dashboard.py"
      - "programme_muscu.md"
      - "data/**"
      - ".github/workflows/dashboard.yml"

permissions:
  contents: read

jobs:
  refresh:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Générer le tableau de bord et préremplir le journal
        run: python generate_dashboard.py

      - name: Enregistrer les fichiers générés
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+users.noreply.github.com"
          git add docs/index.html data/seances.json
          if git diff --cached --quiet; then
            echo "Aucun changement à enregistrer."
          else
            git commit -m "chore: actualise le tableau de bord [skip ci]"
            git push
          fi

  deploy:
    needs: refresh
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Récupérer la dernière version générée
        uses: actions/checkout@v4

      - name: Préparer GitHub Pages
        uses: actions/configure-pages@v5

      - name: Préparer les fichiers statiques
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - name: Publier sur GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
